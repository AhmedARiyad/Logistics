<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Daltex Trucking Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f2a33'/%3E%3Cpath d='M7 11h18v10H7z' fill='none' stroke='%23e8eeee' stroke-width='2'/%3E%3Cpath d='M12 11v10M16 11v10M20 11v10' stroke='%233e6f86' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --ink:#0f2a33; --ink-2:#2b4650; --muted:#5d7580; --line:#d5dfe1; --line-2:#e5ecec;
  --salt:#edf1f0; --panel:#fbfcfc; --rail:#0f2a33; --rail-ink:#c9d9dc;
  --steel:#3e6f86; --steel-2:#6c9ab0; --steel-3:#a9c2cf; --steel-bg:#e3edf1;
  --amber:#b97a00; --amber-bg:#fbefd0; --amber-dot:#e5a100;
  --green:#2f8f62; --green-2:#1e6b48; --green-bg:#dff1e7;
  --red:#c8412b; --red-bg:#f9e1dc;
  --shadow:0 1px 0 rgba(15,42,51,.04), 0 6px 18px -10px rgba(15,42,51,.28);
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#e6eeef; --ink-2:#bdd0d4; --muted:#8aa3ab; --line:#27414a; --line-2:#1d343c;
    --salt:#0b1a20; --panel:#112630; --rail:#07131a; --rail-ink:#a9c0c6;
    --steel:#6aa3bd; --steel-2:#4f84a0; --steel-3:#35607a; --steel-bg:#16313d;
    --amber:#f0b429; --amber-bg:#3a2e0f; --amber-dot:#f0b429;
    --green:#4cbb8a; --green-2:#7ad6ab; --green-bg:#143427;
    --red:#ef7a64; --red-bg:#3d1b16; --shadow:none; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--salt);color:var(--ink);font:400 14px/1.55 "IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-weight:600;line-height:1.3}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}
.ltr{direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);padding:18px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px)}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;color:#fff;font-weight:700;font-size:16px}
.brand svg{flex:none}
.brand small{display:block;font-weight:400;font-size:11.5px;color:var(--rail-ink);opacity:.8}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;background:none;border:0;color:var(--rail-ink);padding:9px 10px;border-radius:8px;text-align:start;width:100%}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.nav .badge{margin-inline-start:auto;background:var(--amber-dot);color:#1b1300;font-size:11.5px;font-weight:700;border-radius:99px;padding:0 7px;min-width:20px;text-align:center}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail .spacer{flex:1}
.rail .foot{font-size:12px;padding:8px;opacity:.85}
.rail .foot button{background:none;border:1px solid rgba(255,255,255,.2);color:inherit;border-radius:7px;padding:3px 9px;margin-top:6px;margin-inline-end:4px;font-size:12px}
.rail .foot button:hover{background:rgba(255,255,255,.08)}

.main{min-width:0;padding:0 28px 60px}
.top{display:flex;align-items:center;gap:14px;padding:16px 0 10px;position:sticky;top:0;background:var(--salt);z-index:5;flex-wrap:wrap}
.search{flex:1;min-width:200px;max-width:420px;position:relative}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 36px 8px 12px;height:38px}
[dir=ltr] .search input{padding:8px 12px 8px 36px}
.search svg{position:absolute;inset-inline-end:11px;top:10px;width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:1.8}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;font-size:12.5px;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.dot.warn{background:var(--amber-dot)} .dot.bad{background:var(--red)} .dot.off{background:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 13px;height:38px;font-weight:500}
.btn:hover{border-color:var(--steel)}
.btn.primary{background:var(--steel);border-color:var(--steel);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{height:30px;padding:3px 10px;font-size:13px}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--line))}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.spin svg{animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:12px 0 18px;flex-wrap:wrap}
.page-h h1{font-size:25px;letter-spacing:-.01em;max-width:44ch}
.page-h p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* headline strip */
.sum{display:flex;gap:26px;flex-wrap:wrap;margin:0 0 18px;padding:0}
.sum li{list-style:none}
.sum b{font-size:24px;font-weight:600;display:block;line-height:1.1}
.sum span{color:var(--muted);font-size:12.5px}
.sum .hot b{color:var(--red)}

/* container blocks: the unit of the whole product */
.cb{display:inline-flex;gap:3px;flex-wrap:wrap;vertical-align:middle}
.cb i{width:13px;height:9px;border-radius:2px;background:var(--steel-bg);border:1.5px dashed var(--steel-3);display:block}
.cb i.s1{background:var(--steel-3);border:1.5px solid var(--steel-3)}
.cb i.s2{background:var(--steel-2);border:1.5px solid var(--steel-2)}
.cb i.s3{background:var(--steel);border:1.5px solid var(--steel)}
.cb i.s4{background:var(--green);border:1.5px solid var(--green)}
.cb i.s5{background:var(--green-2);border:1.5px solid var(--green-2);box-shadow:inset 0 -3px 0 rgba(255,255,255,.28)}
.cb.lg i{width:20px;height:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* runway */
.runway{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(168px,1fr);gap:0;overflow-x:auto;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow)}
.day{border-inline-start:1px solid var(--line-2);min-width:168px;display:flex;flex-direction:column}
.day:first-child{border-inline-start:0}
.day-h{padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.day-h b{font-size:15px}
.day-h span{display:block;color:var(--muted);font-size:12px}
.day.today .day-h{background:var(--ink);color:var(--salt)}
.day.today .day-h span{color:var(--rail-ink)}
.day.undated .day-h{background:var(--amber-bg);color:var(--amber)}
.day.undated .day-h span{color:var(--amber)}
.day.late .day-h{background:var(--red-bg);color:var(--red)}
.day.late .day-h span{color:var(--red)}
.band{padding:8px;display:flex;flex-direction:column;gap:7px;min-height:84px;border-bottom:1px dashed var(--line-2)}
.band:last-child{border-bottom:0}
.band-t{font-size:11.5px;color:var(--muted);font-weight:500}
.chip{display:block;text-align:start;width:100%;background:var(--salt);border:1px solid var(--line);border-inline-start:4px solid var(--steel-2);border-radius:8px;padding:7px 9px;position:relative}
.chip:hover{border-color:var(--steel);background:var(--steel-bg)}
.chip.warn{border-inline-start-color:var(--amber-dot)}
.chip.bad{border-inline-start-color:var(--red)}
.chip.done{border-inline-start-color:var(--green)}
.chip .k{font-weight:600;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.chip .m{font-size:12px;color:var(--muted);margin:1px 0 5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.flag{font-size:11px;font-weight:600;border-radius:99px;padding:0 7px;background:var(--amber-bg);color:var(--amber);white-space:nowrap}
.flag.bad{background:var(--red-bg);color:var(--red)}
.flag.ok{background:var(--green-bg);color:var(--green-2)}
.empty{color:var(--muted);font-size:12.5px;padding:2px 2px}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2{font-size:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;margin-top:18px}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
.att{list-style:none;margin:0;padding:0}
.att li{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;border-bottom:1px solid var(--line-2);cursor:pointer}
.att li:last-child{border-bottom:0}
.att li:hover{background:var(--steel-bg)}
.att .sev{width:8px;height:8px;border-radius:50%;margin-top:8px;flex:none;background:var(--amber-dot)}
.att .sev.bad{background:var(--red)}
.att b{font-weight:600}
.att .why{color:var(--muted);font-size:13px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}

/* tables */
.tw{overflow:auto}
table{border-collapse:collapse;width:100%}
th{font-weight:500;color:var(--muted);font-size:12.5px;text-align:start;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel);position:sticky;top:0}
td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--steel-bg)}
td.nw{white-space:nowrap}
.sel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 9px;height:36px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:3px 12px;font-size:13px}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--salt)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(7,19,26,.45);z-index:20;display:none}
.scrim.open{display:block}
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(560px,100%);background:var(--panel);z-index:21;transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.3)}
[dir=ltr] .drawer{transform:translateX(102%)}
.drawer.open{transform:none}
.drawer-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.drawer-b{overflow:auto;padding:16px 20px 30px;display:flex;flex-direction:column;gap:20px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.sec h3{font-size:14px;margin-bottom:8px}
.field{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.field label{width:96px;color:var(--muted);flex:none}
.field input{flex:1;min-width:0;background:var(--salt);border:1px solid var(--line);border-radius:8px;padding:6px 9px;height:34px}
.mail-box{background:var(--salt);border:1px solid var(--line);border-radius:9px;padding:12px;white-space:pre-wrap;font-size:13px;direction:ltr;text-align:left;unicode-bidi:plaintext}
.tl{list-style:none;margin:0;padding:0;border-inline-start:2px solid var(--line);margin-inline-start:6px}
.tl li{padding:0 14px 12px;position:relative;font-size:13px}
.tl li::before{content:"";position:absolute;inset-inline-start:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--steel-2);border:2px solid var(--panel)}
.tl .t{color:var(--muted);font-size:12px}

/* review */
.rv{padding:14px 16px;border-bottom:1px solid var(--line-2);display:grid;gap:10px}
.rv:last-child{border-bottom:0}
.rv-h{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.rv input{background:var(--salt);border:1px solid var(--line);border-radius:8px;padding:6px 9px;height:34px;min-width:0;flex:1 1 180px}
.state{font-size:12.5px;color:var(--muted)}

/* control */
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line-2)}
.sw:last-child{border-bottom:0}
.sw small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4}
.tog{position:relative;width:44px;height:25px;border-radius:99px;border:0;background:var(--line);flex:none;transition:background .15s}
.tog::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .15s}
.tog[aria-checked="true"]{background:var(--green)}
.tog[aria-checked="true"]::after{transform:translateX(19px)}
[dir=rtl] .tog[aria-checked="true"]::after{transform:translateX(-19px)}
.bars{display:grid;gap:9px;padding:14px 16px}
.bar{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;font-size:13px}
.bar .tr{height:10px;background:var(--steel-bg);border-radius:5px;overflow:hidden;display:flex}
.bar .tr i{display:block;height:100%}
.toast{position:fixed;inset-inline-end:20px;bottom:20px;background:var(--ink);color:var(--salt);padding:10px 16px;border-radius:10px;z-index:40;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:420px;animation:up .2s ease}
.toast.err{background:var(--red);color:#fff}
@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.connect{max-width:520px;margin:9vh auto;padding:0 18px}
.connect .panel{padding:22px}
.connect label{display:block;margin:12px 0 4px;color:var(--ink-2);font-weight:500}
.connect input{width:100%;background:var(--salt);border:1px solid var(--line);border-radius:9px;padding:9px 11px;height:40px;direction:ltr;text-align:left}
.demo-b{background:var(--amber-bg);color:var(--amber);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:500}

@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;inset-block-end:0;inset-inline:0;top:auto;height:auto;flex-direction:row;padding:6px;z-index:15;background-image:none;justify-content:space-around}
  .brand,.rail .foot,.rail .spacer{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around}
  .nav button{flex-direction:column;gap:2px;font-size:11px;padding:5px 2px;text-align:center;justify-content:center}
  .nav .badge{position:absolute;margin:0;transform:translate(14px,-10px)}
  .main{padding:0 14px 90px}
  .kv{grid-template-columns:100px 1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div id="toasts" aria-live="polite"></div>

/* ---------- state ---------- */
const LS = { get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:v }catch(e){ return d } }, set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }, del(k){ try{ localStorage.removeItem(k) }catch(e){} } };
const S = {
  lang: LS.get('lang','ar'), url: LS.get('url',''), key: LS.get('key',''), demo: LS.get('demo','')==='1',
  role:'', data:null, view:'today', owner:'', filter:'all', q:'', sort:'date', busy:false, err:'', open:null, dispatch:null, cfgBusy:'', actTab:'mail', fetchedAt:0
};
const t = k => { const v = TX[S.lang][k]; return v===undefined ? (TX.ar[k]??k) : v };
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const loc = () => S.lang==='ar' ? 'ar-EG-u-nu-latn' : 'en-GB';

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO = s => { const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||''); return m? new Date(+m[1],+m[2]-1,+m[3]) : null };
const today0 = () => { const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()) };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x };
const fmtDay = d => d.toLocaleDateString(loc(),{weekday:'long'});
const fmtShort = d => d.toLocaleDateString(loc(),{day:'numeric',month:'short'});
const fmtLong = s => { const d=parseISO(s); return d? d.toLocaleDateString(loc(),{weekday:'short',day:'numeric',month:'short'}) : '' };
function ago(isoT){ if(!isoT) return ''; const d=new Date(isoT); if(isNaN(d)) return ''; const m=Math.round((Date.now()-d)/60000); if(m<1) return t('ago_now'); if(m<60) return t('ago_m')(m); if(m<1440) return t('ago_h')(Math.round(m/60)); return t('ago_d')(Math.round(m/1440)) }

/* ---------- domain model ---------- */
const STAGE_OF = s => { s=(s||'').replace(/\s+/g,''); if(!s) return -1;
  if(/تعتيق/.test(s)||/وصولالميناء/.test(s)) return 5; if(/تمالتحميل/.test(s)) return 4; if(/وصولالمحطة/.test(s)) return 3; if(/تمالسحب|فيالطريق/.test(s)) return 2; return 2 };
function rowStage(r){ const s=STAGE_OF(r.status); if(s>=0) return s; if(r.cont) return 2; return (r.vendor && r.station)?1:0 }
function build(){
  const d=S.data, T0=today0(), by=new Map();
  d.rows.forEach(r=>{ let b=by.get(r.bkg); if(!b){ b={bkg:r.bkg,tab:r.tab,rows:[],log:r.log,truck:r.truck,invoice:r.invoice,commodity:r.commodity,pol:r.pol,line:r.line,week:r.week,loading:r.loading,ampm:r.ampm}; by.set(r.bkg,b) } b.rows.push(r) });
  const revBy={}; d.review.forEach(x=>{ if(x.booking && !/^(Done|Ignored)/.test(x.status) ) (revBy[x.booking]=revBy[x.booking]||[]).push(x) });
  const list=[...by.values()].map(b=>{
    const R=b.rows, st=R.map(rowStage); b.stages=st; b.qty=R.length;
    b.vendors=[...new Set(R.map(r=>r.vendor).filter(Boolean))]; b.gvendors=[...new Set(R.map(r=>r.gvendor).filter(Boolean))];
    b.stations=[...new Set(R.map(r=>r.station).filter(Boolean))];
    b.loading=R.map(r=>r.loading).filter(Boolean).sort()[0]||''; b.ampm=(R.find(r=>r.ampm)||{}).ampm||'';
    b.rate=R.reduce((a,r)=>a+(r.rate||0),0); b.loaded=st.filter(x=>x>=4).length;
    b.allLoaded=st.every(x=>x>=4); b.minStage=Math.min(...st);
    const dt=parseISO(b.loading), diff=dt?Math.round((dt-T0)/864e5):null; b.diff=diff;
    const is=[]; const need=(diff===null)||diff<=3;
    if(!R.every(r=>r.vendor)) is.push({k:'i_vendor',sev:(diff!==null&&diff<=1)?'bad':'warn'});
    if(!R.every(r=>r.station)) is.push({k:'i_station',sev:(diff!==null&&diff<=1)?'bad':'warn'});
    if(dt && !R.every(r=>r.ampm)) is.push({k:'i_ampm',sev:'warn'});
    if(!dt) is.push({k:'i_date',sev:'warn'});
    if(dt && diff<0 && !b.allLoaded) is.push({k:'i_late',sev:'bad'});
    if(dt && diff<=1 && diff>=0 && R.some(r=>!r.cont)) is.push({k:'i_cont',sev:'warn'});
    if(revBy[b.bkg]) is.push({k:'i_review',sev:'warn'});
    b.issues=is; b.sev=is.some(i=>i.sev==='bad')?'bad':is.length?'warn':(b.allLoaded?'done':'ok');
    b.review=revBy[b.bkg]||[];
    return b;
  });
  S.model={list:list,by:by,T0:T0};
}
const matchQ = b => { const q=S.q.trim().toLowerCase(); if(!q) return true;
  return [b.bkg,b.invoice,b.commodity,b.pol,b.line,b.log,b.truck,...b.vendors,...b.gvendors,...b.stations,...b.rows.map(r=>r.cont)].join(' ').toLowerCase().includes(q) };
const matchOwner = b => !S.owner || b.tab===S.owner;
const ownerName = tab => { const i=(S.data.tabs||[]).indexOf(tab); return i>=0 ? (S.data.labels[i]||tab) : tab };

/* ---------- api ---------- */
async function api(action,payload={}){
  if(S.demo) return Demo.call(action,payload);
  let r; try{ r = await fetch(S.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({key:S.key,action},payload)),redirect:'follow'}) }
  catch(e){ throw new Error(t('net_err')) }
  let tx=''; try{ tx=await r.text() }catch(e){ throw new Error(t('net_err')) }
  let j; try{ j=JSON.parse(tx) }catch(e){ throw new Error(/^\s*</.test(tx)?t('html_resp'):t('net_err')) }
  if(!j.ok){ if(j.error==='auth') throw new Error(t('bad_key')); if(j.error==='forbidden') throw new Error(t('need_admin')); throw new Error(j.message||j.error||'error') }
  return j;
}
async function load(manual){
  if(S.busy) return; S.busy=true; S.err=''; if(manual) render();
  try{ if(manual&&!S.demo) await api('ping'); const j=await api('snapshot'); S.role=j.role||S.role; S.data=j.data; S.fetchedAt=Date.now(); build() }
  catch(e){ S.err=e.message }
  S.busy=false; render();
}
async function act(action,payload,okMsg){
  try{ const j=await api(action,payload); if(j.data){ S.data=j.data; S.fetchedAt=Date.now(); build() } if(okMsg) toast(okMsg); render(); if(S.open) drawer(); return j }
  catch(e){ toast(e.message,true); throw e }
}
function toast(msg,err){ const el=document.createElement('div'); el.className='toast'+(err?' err':''); el.textContent=msg; $('#toasts').appendChild(el); setTimeout(()=>el.remove(),err?5200:2600) }

/* ---------- components ---------- */
function blocks(b,lg){ return `<span class="cb${lg?' lg':''}" role="img" aria-label="${b.loaded}/${b.qty}">${b.stages.slice().sort((a,z)=>z-a).map(s=>`<i class="s${s}"></i>`).join('')}</span>` }
function rowBlocks(R){ return `<span class="cb">${R.map(r=>`<i class="s${rowStage(r)}"></i>`).join('')}</span>` }
function flags(b,max=2){ return b.issues.slice(0,max).map(i=>`<span class="flag ${i.sev==='bad'?'bad':''}">${t(i.k)}</span>`).join('') }
function chip(b){
  const goods=[b.commodity,b.pol].filter(Boolean).join(' - ');
  return `<button class="chip ${b.sev}" data-open="${esc(b.bkg)}">
    <span class="k"><span class="ltr">${esc(b.bkg.length>10?'…'+b.bkg.slice(-8):b.bkg)}</span><span class="muted">${b.qty}</span></span>
    <span class="m">${esc(goods)}</span>${blocks(b)}
    ${b.stations.length?`<span class="m" style="margin:5px 0 0">${esc(b.stations.join('، '))}</span>`:''}
    ${b.issues.length?`<span class="tags">${flags(b,2)}</span>`:''}</button>`;
}
function legend(){ return `<div class="legend">${[0,1,2,3,4,5].map(i=>`<span><span class="cb"><i class="s${i}"></i></span>${t('stage'+i)}</span>`).join('')}</div>` }

/* ---------- views ---------- */
function ownerSel(){ const o=S.data.tabs; return `<select class="sel" data-owner aria-label="${t('all_resp')}"><option value="">${t('all_resp')}</option>${o.map((x,i)=>`<option value="${esc(x)}" ${S.owner===x?'selected':''}>${esc(S.data.labels[i]||x)}</option>`).join('')}</select>` }

function vToday(){
  const M=S.model, T0=M.T0, L=M.list.filter(b=>matchOwner(b)&&matchQ(b));
  const open=L.filter(b=>!b.allLoaded||b.diff===null||b.diff>=-1);
  const todayL=L.filter(b=>b.diff===0), todayC=todayL.reduce((a,b)=>a+b.qty,0);
  const attn=L.filter(b=>b.issues.length&&!(b.allLoaded)).sort((a,b)=>(b.sev==='bad')-(a.sev==='bad')||((a.diff??99)-(b.diff??99)));
  const late=L.filter(b=>b.diff!==null&&b.diff<0&&!b.allLoaded);
  const loaded=L.reduce((a,b)=>a+b.loaded,0), cont=L.reduce((a,b)=>a+b.qty,0);
  const cols=[]; cols.push({k:'late',items:late,h:t('late'),s:''});
  cols.push({k:'undated',items:L.filter(b=>b.diff===null),h:t('undated'),s:''});
  for(let i=0;i<8;i++){ const d=addDays(T0,i); const items=L.filter(b=>b.diff===i||(i===0&&b.diff!==null&&b.diff<0&&b.allLoaded&&false)); cols.push({k:i===0?'today':'day',d:d,items:items,h:i===0?t('today_h'):fmtDay(d),s:fmtShort(d)}) }
  const bandOf=(items,ap)=>items.filter(b=>ap?b.ampm===ap:!b.ampm);
  const runway=cols.map(c=>{
    const bands=c.k==='late'||c.k==='undated'?[['',c.items]]:[['AM',bandOf(c.items,'AM')],['PM',bandOf(c.items,'PM')],['',bandOf(c.items,'')]].filter(x=>x[0]||x[1].length);
    return `<section class="day ${c.k==='today'?'today':c.k==='late'?'late':c.k==='undated'?'undated':''}" aria-label="${esc(c.h)}"><div class="day-h"><b>${esc(c.h)}</b><span>${esc(c.s||(c.items.reduce((a,b)=>a+b.qty,0)+' '+t('containers')))}</span></div>
      ${bands.map(([ap,items])=>`<div class="band">${(c.k==='late'||c.k==='undated')?'':`<div class="band-t">${ap==='AM'?t('am'):ap==='PM'?t('pm'):t('noap')}</div>`}${items.length?items.map(chip).join(''):(c.k==='late'||c.k==='undated'?`<div class="empty">${t('none_here')}</div>`:'<div class="empty">&nbsp;</div>')}</div>`).join('')}</section>`;

const uniq = k => [...new Set(S.data.rows.map(r=>r[k]).filter(Boolean))].sort();
function dispatchView(d){
  if(d.err&&!d.mails.length) return `<div class="flag bad">${esc(d.err)}</div>`;
  if(d.missing.length) return `<div class="flag bad">${t('miss')}: ${esc(d.missing.join('، '))}</div>`;
  return (d.warn.length?`<div class="flag" style="margin-bottom:8px">${t('warn')}: ${esc(d.warn.join('، '))}</div>`:'')+d.mails.map((m,i)=>`<div style="margin-bottom:14px"><div class="muted ltr" style="margin-bottom:4px">${t('to')}: ${esc(m.to)}<br>${t('cc')}: ${esc(m.cc)}<br>${t('subject')}: ${esc(m.subject)}</div><div class="mail-box" id="mb${i}">${esc(m.body)}</div>
   <div class="row" style="margin-top:8px"><button class="btn sm" data-copy="${i}">${t('copy')}</button><a class="btn sm" href="mailto:${encodeURIComponent(m.to)}?cc=${encodeURIComponent(m.cc)}&subject=${encodeURIComponent(m.subject)}&body=${encodeURIComponent(m.body)}">${t('open_mail')}</a></div></div>`).join('');
}

/* ---------- events ---------- */
function bind(){
  const R=$('#root');
  const on=(sel,ev,fn)=>R.querySelectorAll(sel).forEach(e=>e.addEventListener(ev,fn));
  on('[data-go]','click',e=>{ S.view=e.currentTarget.dataset.go; if(e.currentTarget.hasAttribute('data-closed')) closeDrawer(); render(); window.scrollTo(0,0) });
  on('[data-open]','click',e=>{ const k=e.currentTarget.dataset.open; if(k&&S.model.by.has(k)){ S.open=k; S.dispatch=null; drawer() } });
  on('[data-owner]','change',e=>{ S.owner=e.target.value; render() });
  on('[data-filter]','click',e=>{ S.filter=e.currentTarget.dataset.filter; render() });
  on('[data-acttab]','click',e=>{ S.actTab=e.currentTarget.dataset.acttab; render() });
  on('[data-refresh]','click',()=>load(true));
  on('[data-lang]','click',()=>{ S.lang=S.lang==='ar'?'en':'ar'; LS.set('lang',S.lang); render(); if(S.open) drawer() });
  on('[data-theme]','click',()=>{ const cur=document.documentElement.dataset.theme; const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme:dark)').matches; document.documentElement.dataset.theme=dark?'light':'dark'; LS.set('theme',dark?'light':'dark') });
  on('[data-disc]','click',()=>{ LS.del('key'); LS.del('demo'); S.key=''; S.demo=false; S.data=null; S.err=''; render() });
  on('[data-export]','click',exportCsv);
  on('[data-sync]','click',async()=>{ S.cfgBusy='sync'; render(); try{ await act('syncNow',{},t('done')) }catch(e){} S.cfgBusy=''; render() });
  on('[data-pause]','click',()=>act('pause',{}).then(()=>load()).catch(()=>{}));
  on('[data-resume]','click',()=>act('resume',{}).then(()=>load()).catch(()=>{}));
  on('[data-tog]','click',async e=>{ const id=e.currentTarget.dataset.tog, on=e.currentTarget.getAttribute('aria-checked')==='true'; e.currentTarget.setAttribute('aria-checked',String(!on)); e.currentTarget.disabled=true;
    try{ if(id.startsWith('st:')) await act('setStatus',{status:id.slice(3),open:!on},t('saved')); else await act('setConfig',{key2:id.slice(4),value:!on},t('saved')) }catch(x){ render() } });
  on('[data-rvact]','click',async e=>{ const row=+e.currentTarget.dataset.row, card=e.currentTarget.closest('[data-rv]'), x=S.data.review.find(z=>z.row===row);
    const val=card.querySelector('[data-f=value]'), why=card.querySelector('[data-f=reason]');
    try{ const j=await act('review',{row:row,booking:x.booking,type:x.type,decision:e.currentTarget.dataset.rvact,value:val?val.value:undefined,reason:why?why.value:undefined}); if(j.status&&!/^(Done|Ignored|Undone)/.test(j.status)) toast(j.status,true); else toast(t('done')) }catch(err){} });
  const q=$('#q'); if(q) q.addEventListener('input',e=>{ S.q=e.target.value; clearTimeout(bind.t); bind.t=setTimeout(render,180) });
  const cn=R.querySelector('[data-connect]');
  if(cn) cn.addEventListener('click',async()=>{ const u=$('#c-url').value.trim(), k=$('#c-key').value.trim(); S.url=u; S.key=k; S.demo=false; S.err='';
    if(!u||!k){ S.err=t('need_both'); render(); return }
    if(!/^https:\/\/script\.google\.com\/(a\/[^/]+\/)?macros\/s\/[^/]+\/exec\/?$/.test(u)){ S.err=t('bad_url'); render(); return }
    LS.set('url',u); LS.set('key',k); LS.del('demo'); S.connecting=true; render();
    try{ await load(true) } finally{ S.connecting=false; render() } });
  const dm=R.querySelector('[data-demo]'); if(dm) dm.addEventListener('click',async()=>{ S.demo=true; S.role='admin'; LS.set('demo','1'); Demo.reset(); await load(true) });
}
function bindDrawer(b){
  const el=$('#drawer');
  el.querySelector('[data-close]').addEventListener('click',closeDrawer);
  el.querySelectorAll('[data-go]').forEach(x=>x.addEventListener('click',()=>{ S.view=x.dataset.go; closeDrawer(); render() }));
  const dp=el.querySelector('[data-dispatch]'); if(dp) dp.addEventListener('click',async()=>{ dp.disabled=true; try{ const j=await api('dispatch',{bkg:b.bkg}); S.dispatch=j.data; drawer() }catch(e){ toast(e.message,true); dp.disabled=false } });
  el.querySelectorAll('[data-copy]').forEach(x=>x.addEventListener('click',()=>{ const i=x.dataset.copy; const m=S.dispatch.mails[+i]; const txt=`To: ${m.to}\nCc: ${m.cc}\nSubject: ${m.subject}\n\n${m.body}`; (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast(t('copied')),()=>toast(t('copied'))) }));
  const f=el.querySelector('[data-edit]'); if(f) f.addEventListener('submit',async e=>{ e.preventDefault(); const fd=new FormData(f), reason=fd.get('reason'); let n=0;
    const cur={vendor:b.vendors.length===1?b.vendors[0]:'',gvendor:b.gvendors.length===1?b.gvendors[0]:'',station:b.stations.length===1?b.stations[0]:'',ampm:b.ampm==='AM'?'Am':b.ampm==='PM'?'Pm':''};
    try{ for(const k of ['vendor','gvendor','station','ampm']){ const v=String(fd.get(k)||'').trim(); if(v===cur[k]||v==='') continue; for(const r of b.rows){ await act('editCell',{tab:r.tab,row:r.row,bkg:b.bkg,field:k,value:v,reason:reason}); n++ } }
      if(n) toast(t('saved')); }catch(err){} });
}
function closeDrawer(){ S.open=null; drawer() }
$('#scrim').addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&S.open) closeDrawer() });
function exportCsv(){
  const rows=S.data.rows.filter(r=>{ const b=S.model.by.get(r.bkg); return b&&matchOwner(b)&&matchQ(b) });
  const cols=['tab','bkg','invoice','log','commodity','pol','line','vendor','gvendor','loading','ampm','station','place','area','cont','driver','status','rate'];
  const csv='﻿'+[cols.join(',')].concat(rows.map(r=>cols.map(c=>'"'+String(r[c]??'').replace(/"/g,'""')+'"').join(','))).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='bookings-'+iso(new Date())+'.csv'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

  async function call(a,p){ await wait(220);

/* ---------- boot ---------- */
(function(){
  const th=LS.get('theme',''); if(th) document.documentElement.dataset.theme=th;
  const p=new URLSearchParams(location.hash.replace(/^#/,''));   // optional: #url=...&key=...  (one-time link; removed from the address bar)
  if(p.get('url')&&p.get('key')){ S.url=p.get('url'); S.key=p.get('key'); S.demo=false; LS.set('url',S.url); LS.set('key',S.key); LS.del('demo'); history.replaceState(null,'',location.pathname+location.search) }
  if(p.get('demo')==='1'){ S.demo=true; S.role='admin'; LS.set('demo','1'); history.replaceState(null,'',location.pathname+location.search) }
  if(p.get('view')&&['today','book','review','vendors','control','activity'].includes(p.get('view'))) S.view=p.get('view');
  if(S.demo||(S.url&&S.key)){ if(S.demo){ S.role='admin' } load(true) } else render();
  setInterval(()=>{ if(!document.hidden && S.data && !S.open && !S.busy && !(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) load() },60000);
})();
